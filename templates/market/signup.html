{% extends 'market/base.html' %}{% block content %}<main class="form-page"><h1>회원가입</h1><p class="muted">거래에 사용할 내 정보를 입력해주세요.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}</div>{% endfor %}<button class="primary full">회원가입</button></form><p>이미 이웃이신가요? <a href="{% url 'login' %}">로그인</a></p></main>{% endblock %}
