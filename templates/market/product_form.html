{% extends 'market/base.html' %}{% block content %}<main class="form-page wide"><a class="back" href="{% url 'product_list' %}">← 목록으로</a><h1>{{ page_title }}</h1><p class="muted">이웃에게 물건의 이야기를 들려주세요.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.name == 'image' %}<small>JPG, PNG 등 이미지 · 최대 5MB</small>{% endif %}</div>{% endfor %}<button class="primary full">저장하기</button></form></main>{% endblock %}
