{% extends 'market/base.html' %}{% block content %}<main class="form-page"><span class="eyebrow">다시 만나서 반가워요</span><h1>우리 동네 거래의 시작</h1><p class="muted">로그인하고 이웃과 이야기를 나눠보세요.</p><form method="post">{% csrf_token %}<div class="field"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">비밀번호</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button class="primary full">로그인</button></form><p>처음 오셨나요? <a href="{% url 'signup' %}">회원가입</a></p></main>{% endblock %}
